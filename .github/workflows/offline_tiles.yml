name: Rebuild offline map tiles

# Regenerates the self-hosted vector-tile .mbtiles for each of Italy's 5
# Geofabrik macro-zones (tools/offline_tiles/) and publishes them as assets
# of a GitHub Release (tag below), where OfflineTileService downloads them
# from via a plain public URL (Settings -> "Mappe offline") — no external
# hosting account/secret needed, since this repo is public.
on:
  workflow_dispatch: {}
  schedule:
    # 03:00 UTC on the 1st of every month — adjust to taste; OSM data
    # doesn't need fresher-than-monthly offline tiles for this app.
    - cron: "0 3 1 * *"

# The release is re-published (assets replaced) on every run rather than
# creating a new one each time — TileSourceConfig always points at this
# same fixed tag.
env:
  RELEASE_TAG: offline-tiles-latest

permissions:
  contents: write # required to create/update the GitHub Release

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # Planetiler's own jar and the small auxiliary datasets it downloads
      # (water polygons, natural earth) don't need to be fresh — cache them
      # across runs. Each zone's OSM extract is downloaded fresh every run
      # in build_zones.sh, since freshness there is the whole point of this job.
      - name: Cache Planetiler jar and auxiliary data
        uses: actions/cache@v4
        with:
          path: |
            tiles-work/planetiler.jar
            tiles-work/data
          key: planetiler-assets-v1

      - name: Download Planetiler
        working-directory: tiles-work
        run: |
          if [ ! -f planetiler.jar ]; then
            curl -L -o planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
          fi

      - name: Build per-zone .mbtiles
        working-directory: tiles-work
        run: |
          bash ../tools/offline_tiles/build_zones.sh \
            ../tools/offline_tiles/zones.json \
            planetiler.jar \
            out

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Offline map tiles (auto-updated)
          body: >-
            Self-hosted vector tiles for the app's offline map download
            (Settings -> "Mappe offline"), rebuilt automatically by
            .github/workflows/offline_tiles.yml. Not a versioned release of
            the app itself.
          files: tiles-work/out/*.mbtiles
