name: Release

# Pubblica un APK firmato quando si pusha un tag di versione: git tag v1.0.0 && git push origin v1.0.0
# Un tag con suffisso (v1.0.0-rc1) diventa una pre-release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Segreti di build (mai nel repo)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          for v in GOOGLE_SERVICES_JSON MAPS_API_KEY KEYSTORE_BASE64; do
            [ -n "${!v}" ] || { echo "::error::Segreto mancante: $v"; exit 1; }
          done
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          echo "MAPS_API_KEY=$MAPS_API_KEY" >> local.properties
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test unitari
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: APK release firmato
        env:
          VAPIAN_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          VAPIAN_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VAPIAN_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VAPIAN_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease -PvapianVersion="${GITHUB_REF_NAME#v}"

      - name: Verifica firma e versione
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" | grep -E "^package"
          cp "$APK" "VaPian-${GITHUB_REF_NAME}.apk"
          sha256sum "VaPian-${GITHUB_REF_NAME}.apk" > "VaPian-${GITHUB_REF_NAME}.apk.sha256"

      - name: Pubblica la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FLAGS=""
          case "$GITHUB_REF_NAME" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $FLAGS --generate-notes --title "VaPian! $GITHUB_REF_NAME" \
            "VaPian-${GITHUB_REF_NAME}.apk" "VaPian-${GITHUB_REF_NAME}.apk.sha256"
