name: Release APK

# Triggers on pushing a version tag, e.g. `git tag v1.0.0 && git push origin v1.0.0`.
# The version name/build number are read from the tag itself, not from pubspec.yaml.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # required to create the GitHub Release

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # Release signing material never touches the repo — decoded from
      # secrets straight into the (gitignored) locations android/app/build.gradle.kts
      # expects: android/app/vapian-release.p12 + android/key.properties.
      - name: Set up release signing
        working-directory: android
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/vapian-release.p12
          cat > key.properties <<EOF
          storeFile=vapian-release.p12
          storeType=PKCS12
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # android/app/build.gradle.kts reads MAPS_API_KEY from local.properties
      # (gitignored, machine-local) — CI has no such file, so without this the
      # release manifest gets an empty key and the map fails to load.
      - name: Set up local.properties
        run: echo "MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}" >> android/local.properties

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/vapian-release.p12

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
